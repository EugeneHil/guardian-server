name: deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Require a commit on main
        shell: pwsh
        run: |
          # Only code that is on main may be built for deployment. The build job has no access to environment values.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Commit $env:GITHUB_SHA is not reachable from origin/main" }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch vcpkg history
        shell: pwsh
        run: |
          # The preinstalled vcpkg clone may be old or shallow and lack the manifest baseline commit.
          $shallow = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --is-shallow-repository
          if ($shallow -eq 'true') {
            git -C $env:VCPKG_INSTALLATION_ROOT fetch --unshallow origin
          } else {
            git -C $env:VCPKG_INSTALLATION_ROOT fetch origin
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out vcpkg at the manifest baseline
        shell: pwsh
        run: |
          # Ports and version files are read from the vcpkg working tree, so it must match the baseline.
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw 'vcpkg.json has no builtin-baseline' }
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure (Release)
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Package
        shell: pwsh
        run: |
          # The archive holds exactly guardian-server.exe and web/; apply-update.ps1 rejects anything else.
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item build/windows-release/guardian-server.exe $stage
          Copy-Item web (Join-Path $stage 'web') -Recurse
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = "guardian-server-$($env:GITHUB_SHA.Substring(0, 12)).zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path dist $name)
      - uses: actions/upload-artifact@v7
        with:
          name: guardian-server-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    # Tags only: a branch run (workflow_dispatch) builds but never reaches the deploy credentials.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guardian-server-zip
          path: dist
      - name: Write SSH key and known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Upload and apply the update
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          zip_path=$(ls dist/*.zip)
          zip_name=$(basename "$zip_path")
          ssh_opts=(
            -i "$RUNNER_TEMP/ssh/id_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          )
          scp "${ssh_opts[@]}" "$zip_path" "$VPS_USER@$VPS_HOST:C:/guardian/incoming/$zip_name"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\guardian\\scripts\\apply-update.ps1 -Zip C:\\guardian\\incoming\\$zip_name"
      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
