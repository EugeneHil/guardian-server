name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Test
        run: ctest --preset windows

  server-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: brew install ninja llvm openssl@3
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos
      - name: Test
        run: ctest --preset macos
      - name: Lint
        run: scripts/lint.sh
      - name: Coverage
        run: scripts/coverage.sh
