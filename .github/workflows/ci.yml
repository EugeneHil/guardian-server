name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch vcpkg history
        shell: pwsh
        run: |
          # The preinstalled vcpkg clone may be old or shallow and lack the manifest baseline commit.
          $shallow = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --is-shallow-repository
          if ($shallow -eq 'true') {
            git -C $env:VCPKG_INSTALLATION_ROOT fetch --unshallow origin
          } else {
            git -C $env:VCPKG_INSTALLATION_ROOT fetch origin
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Test
        run: ctest --preset windows

  server-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: brew install ninja llvm openssl@3
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos
      - name: Test
        run: ctest --preset macos
      - name: Lint
        run: scripts/lint.sh
      - name: Coverage
        run: scripts/coverage.sh
